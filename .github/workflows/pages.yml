name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore prepared videos
        uses: actions/cache@v4
        with:
          path: site/media
          key: portfolio-media-v2-${{ hashFiles('site/media.json', 'scripts/prepare_media.py') }}
      - name: Prepare video tools
        run: |
          python -m pip install gdown
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Prepare and verify all videos
        run: python scripts/prepare_media.py
      - name: Check player script
        run: node --check site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
